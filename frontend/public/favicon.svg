<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="jbG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6C3CE1"/>
      <stop offset="0.55" stop-color="#E9408B"/>
      <stop offset="1" stop-color="#F27121"/>
    </linearGradient>
  </defs>
  <!-- Tile -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#jbG)"/>
  <!-- soft top highlight -->
  <rect x="4" y="4" width="92" height="46" rx="24" fill="#ffffff" opacity="0.10"/>
  <!-- Two linked boxes = "joint" of "boxes" -->
  <rect x="24" y="26" width="34" height="34" rx="11" fill="none" stroke="#ffffff" stroke-width="6.5" opacity="0.9"/>
  <!-- knockout so the front link appears woven over the back one -->
  <rect x="38" y="40" width="26" height="26" rx="10" fill="url(#jbG)"/>
  <rect x="42" y="40" width="34" height="34" rx="11" fill="none" stroke="#ffffff" stroke-width="6.5"/>
</svg>
