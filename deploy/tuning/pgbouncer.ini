; ===================================================================
;  Jointbox — PgBouncer (transaction pooling)
;  Fans a huge number of app/RADIUS clients onto a small pool of real
;  PostgreSQL backends. This is THE key piece that lets the stack survive
;  100k-session churn without exhausting Postgres connections.
;
;  Install:
;    sudo apt install -y pgbouncer
;    sudo cp pgbouncer.ini      /etc/pgbouncer/pgbouncer.ini
;    sudo cp pgbouncer.userlist /etc/pgbouncer/userlist.txt   (see below)
;    sudo systemctl enable --now pgbouncer
;
;  Then point the APP at PgBouncer (port 6432) instead of Postgres (5432),
;  and add &pgbouncer=true so Prisma disables prepared statements:
;    DATABASE_URL="postgresql://jointbox:jointbox123@localhost:6432/jointbox?pgbouncer=true&connection_limit=1"
;
;  IMPORTANT: FreeRADIUS's own SQL module should connect DIRECTLY to
;  Postgres :5432 (not through PgBouncer) — it manages its own pool and
;  uses session features. Only the Node app goes through PgBouncer.
; ===================================================================

[databases]
jointbox = host=127.0.0.1 port=5432 dbname=jointbox

[pgbouncer]
listen_addr = 127.0.0.1
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; transaction mode = a backend is returned to the pool after each txn,
; so thousands of app clients share a few hundred real connections.
pool_mode = transaction

; Real connections opened to Postgres. Keep well under Postgres
; max_connections (200). This is the whole point — 100k clients, ~150 backends.
default_pool_size = 150
min_pool_size = 20
reserve_pool_size = 30
reserve_pool_timeout = 3

; Client-side capacity (how many app/queue clients can connect to PgBouncer)
max_client_conn = 5000
max_db_connections = 180

server_idle_timeout = 60
server_lifetime = 3600
query_wait_timeout = 20
ignore_startup_parameters = extra_float_digits
