# ===================================================================
#  Jointbox — PostgreSQL tuning for large deployments (~100k active)
#  Drop-in file. Install as a conf.d include so upgrades don't clobber it:
#
#    sudo cp postgresql-jointbox.conf /etc/postgresql/16/main/conf.d/
#    sudo systemctl restart postgresql
#
#  Values below are sized for a DEDICATED DB box with ~32 GB RAM / 8 vCPU.
#  Rule of thumb — scale with RAM:
#    shared_buffers        = 25% of RAM
#    effective_cache_size  = 60-70% of RAM
#    work_mem              = (RAM * 0.25) / max_connections  (keep modest w/ pooling)
#    maintenance_work_mem  = 1-2 GB
# ===================================================================

# ── Connections ────────────────────────────────────────────────
# Keep this MODEST and let PgBouncer fan 100k clients into a small pool.
# 100k sessions do NOT mean 100k DB connections — PgBouncer (transaction
# mode) multiplexes them onto ~100-200 real backends.
max_connections = 200

# ── Memory ─────────────────────────────────────────────────────
shared_buffers = 8GB                 # ~25% of 32GB
effective_cache_size = 22GB          # ~70% of 32GB (planner hint, not allocated)
work_mem = 32MB                      # per sort/hash op; conservative under pooling
maintenance_work_mem = 2GB           # faster VACUUM / index builds
huge_pages = try

# ── Write / WAL (accounting is write-heavy) ────────────────────
wal_level = replica                  # enables a streaming standby replica
max_wal_size = 8GB
min_wal_size = 2GB
checkpoint_completion_target = 0.9   # spread checkpoint I/O, avoid write spikes
wal_compression = on
synchronous_commit = off             # accounting can tolerate <1s loss; big write speedup
                                     # (set 'on' if you need zero-loss billing writes)

# ── Planner / parallelism ──────────────────────────────────────
random_page_cost = 1.1               # assumes SSD/NVMe storage
effective_io_concurrency = 200       # SSD/NVMe
max_worker_processes = 8
max_parallel_workers = 8
max_parallel_workers_per_gather = 4
default_statistics_target = 200      # better plans on big tables

# ── Autovacuum (must keep up with radacct churn) ───────────────
autovacuum = on
autovacuum_max_workers = 6
autovacuum_naptime = 15s
autovacuum_vacuum_cost_limit = 3000  # let it work faster on busy tables

# ── Replication slots (for the hot standby, optional) ──────────
max_wal_senders = 5
max_replication_slots = 5

# ── Logging: catch slow queries so you can add indexes ─────────
log_min_duration_statement = 500ms   # log anything slower than 0.5s
log_checkpoints = on
log_autovacuum_min_duration = 0

# ── Timeouts (don't let a stuck client hold a backend forever) ─
idle_in_transaction_session_timeout = 30s
statement_timeout = 60s
